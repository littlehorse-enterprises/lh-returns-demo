plugins { id 'application' }
group = 'io.littlehorse.demo'
version = '0.1.0'
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.compilerArgs.add('-parameters'); options.encoding = 'UTF-8' }
dependencies {
    implementation 'io.littlehorse:littlehorse-client:1.3.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.apache.kafka:kafka-clients:4.0.0'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.16'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'io.littlehorse.returns.ReturnsApplication' }
test { useJUnitPlatform() }
