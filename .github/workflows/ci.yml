name: Example checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build and test Java
        run: ./gradlew --no-daemon test installDist
      - name: Test storefront
        run: node scripts/test-storefront.cjs
      - name: Test setup and scenario scripts
        run: |
          python3 scripts/test-scenarios.py
          python3 scripts/test-startup.py
          python3 scripts/test-supervisor.py
          python3 scripts/test-connectors.py
          python3 scripts/test-project-isolation.py
          python3 scripts/test-compose-images.py
      - name: Build application and Kafka Connect images
        run: docker compose --env-file /dev/null build app connect
      - name: Verify published Agent Connector image
        run: docker compose --env-file /dev/null pull agent
